<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>我的刷題紀錄</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center p-6">
  <div class="max-w-2xl w-full">
    <h1 class="text-3xl font-bold mb-6 text-center text-blue-600">
      刷題紀錄
    </h1>
    <!-- 🔄 新增重新整理按鈕 -->
      <div class="flex justify-center mb-6">
        <button id="reloadBtn" 
          class="px-4 py-2 bg-blue-500 text-white rounded-lg shadow hover:bg-blue-600">
          🔄 重新整理
        </button>
      </div>
    <ul id="commits" class="space-y-4">
      <li class="text-gray-500 text-center">載入中...</li>
    </ul>
  </div>

  <script>
    const apiUrl = "https://api.github.com/repos/sloooothy/coding_preparing/commits";

    const allowedExt = [".cpp", ".py", ".sql"];

    async function loadCommits() {
  const container = document.getElementById("commits");
  container.innerHTML = `<li class="text-gray-500 text-center">載入中...</li>`;

  try {
    // 加上亂數避免快取
    const res = await fetch(`${apiUrl}&_=${Date.now()}`);
    if (!res.ok) throw new Error("API 請求失敗");
    const commits = await res.json();

    const grouped = {};

    for (let commit of commits) {
      // 取得 commit 詳細檔案
      const detailRes = await fetch(`${commit.url}?_=${Date.now()}`);
      if (!detailRes.ok) continue;
      const detail = await detailRes.json();

      // 篩選檔案
      const validFiles = detail.files?.filter(f =>
        allowedExt.some(ext => f.filename.endsWith(ext))
      );
      if (!validFiles || validFiles.length === 0) continue;

      const dateObj = new Date(commit.commit.author.date);
      const date = dateObj.toLocaleDateString("zh-TW", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      });

      if (!grouped[date]) grouped[date] = [];
      grouped[date].push({
        msg: commit.commit.message,
        url: commit.html_url,
        time: dateObj.toLocaleTimeString("zh-TW"),
        files: validFiles.map(f => f.filename)
      });
    }

    render(grouped);
  } catch (err) {
    container.innerHTML = `<li class="text-red-500 text-center">⚠️ 載入失敗：${err.message}</li>`;
  }
}

function render(grouped) {
  const container = document.getElementById("commits");
  container.innerHTML = "";

  Object.keys(grouped).sort((a, b) => b.localeCompare(a)).forEach(date => {
    const section = document.createElement("div");
    section.className = "mb-8";

    section.innerHTML = `
      <h2 class="text-2xl font-bold mb-4 bg-gray-200 px-3 py-1 rounded">
        ${date}
      </h2>
      <div class="space-y-3">
        ${grouped[date].map(c => `
          <div class="bg-white shadow p-4 rounded-lg">
            <a href="${c.url}" target="_blank"
               class="text-lg font-semibold text-blue-600 hover:underline">
              ${c.msg}
            </a>
            <div class="text-sm text-gray-500 mt-1">⏰ ${c.time}</div>
            <div class="text-sm text-gray-600 mt-2">
              檔案: ${c.files.join(", ")}
            </div>
          </div>
        `).join("")}
      </div>
    `;
    container.appendChild(section);
  });
}

// 🔄 綁定重新整理按鈕
document.getElementById("reloadBtn").addEventListener("click", () => {
  loadCommits();
});

// 首次載入
loadCommits();
  </script>
</body>
</html>
